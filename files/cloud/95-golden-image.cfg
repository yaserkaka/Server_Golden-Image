# Installed by the golden-image build (scripts/provision/50-firstboot.sh).
# Datasources clones can receive their config from:
#   NoCloud      - seed ISO (KVM/libvirt clones, see deploy/kvm)
#   VMware       - guestinfo.* properties (vSphere clones, see deploy/vsphere)
#   ConfigDrive / OVF - other virtualization platforms
datasource_list: [NoCloud, VMware, ConfigDrive, OVF, None]

# Fresh SSH host keys on every new instance
ssh_deletekeys: true
ssh_genkeytypes: [ed25519, ecdsa, rsa]

# Hostname comes from the instance metadata; keep /etc/hosts in sync
preserve_hostname: false
manage_etc_hosts: localhost

# Key-based SSH only
ssh_pwauth: false
disable_root: true
